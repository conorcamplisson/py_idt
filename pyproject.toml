[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-idt-order"
dynamic = ["version"]
description = "A python interface for creating IDT bulk oligo order forms in Excel."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Conor Camplisson", email = "conor.camplisson@gmail.com" }]

keywords = ["idt", "oligo", "oligonucleotide", "dna", "excel", "bulk order"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# lower bounds for users; uv.lock pins the exact versions for development and CI.
# xlrd was declared but never imported, so it is dropped rather than carried forward.
dependencies = [
    "pandas",
    "xlsxwriter",
]

[project.urls]
Homepage = "https://github.com/conorcamplisson/py_idt"
Documentation = "https://conorcamplisson.github.io/py_idt/"
Issues = "https://github.com/conorcamplisson/py_idt/issues"
Changelog = "https://github.com/conorcamplisson/py_idt/blob/master/CHANGELOG.md"

[tool.hatch.version]
path = "src/py_idt_order/_version.py"

# Nothing ships by default; everything is declared. Without this the
# sdist picked up docs/_build/ — the whole rendered Sphinx site, fonts included — and weighed
# 2.4 MB against a 6.8 KB wheel.
[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "examples/",
    "docs/",
    "images/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]
exclude = ["docs/_build/"]

[tool.hatch.build.targets.wheel]
packages = ["src/py_idt_order"]

[dependency-groups]
# Dev tools are NOT bound by the package's supported-Python floor: they run on the developer's
# machine and in one CI job, not on the user's interpreter. The docs toolchain has dropped 3.10,
# so it is marked accordingly rather than dragging the package's own floor up with it.
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
    "pre-commit==4.3.0",
    "sphinx==8.2.3; python_version >= '3.11'",
    "pydata-sphinx-theme==0.16.1; python_version >= '3.11'",
    "myst-parser==4.0.1; python_version >= '3.11'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ANN (type annotations) is deliberately absent: this project does not use annotations.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# tests document themselves by their names
"tests/**" = ["D"]

[tool.pytest.ini_options]
markers = ["integration: needs an external program; not run on every push"]
addopts = "--strict-markers -m 'not integration'"
testpaths = ["tests"]
